<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation - CARTOLERIA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
    
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: black;
      margin: 0;
    }

    .confirmation-box {
      background: rgb(0, 0, 0);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
    }

    .confirmation-box h1 {
      color:#ffe259;
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .confirmation-box p {
      font-size: 1.1rem;
      color: #ffffff;
      margin: 10px 0;
    }

    .confirmation-box button {
      margin-top: 25px;
      padding: 10px 20px;
      border: none;
      background: #a2ff0000;
      color: #ffe259;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .confirmation-box button:hover {
      background: #ffffff;
      color: black;
    }
  </style>
</head>
<body>
  <div class="confirmation-box">
    <h1> Order Confirmed!</h1>
    <p>Thank you for using <b>CARTOLERIA Print-Pro</b>.</p>
    <p>Your files are being processed and will be delivered soon.</p>
    <p>We’ll notify you once it’s ready for pickup/delivery.</p>
    <button onclick="window.location.href='index.html'">Back to Home</button>
  </div>
</body>
</html>
